# Tests on macOS, Windows and Linux; builds the desktop app for macOS and Windows, and checks each build the way a new user would meet it:
# an empty data folder, a model downloaded through the app, real proposals from the built-in engine.
# Pushing a tag v* publishes the builds as a GitHub Release.
#
# Kept cheap, because private repositories have a small allowance of Actions minutes (macOS minutes count several
# times over) and of artifact storage:
#   - a push to a working branch: unit tests on Linux only;
#   - a push to main, a pull request, a tag or a manual run (Actions → build → Run workflow): tests on all three
#     platforms, then the full build and smoke tests of the Mac and Windows apps (Linux runs from source);
#   - finished apps are stored only for a manual run with "keep the apps" ticked (3 days) or a tag (1 day: the
#     release job copies them to the Release, whose files do not count against Actions storage). A newer push to
#     the same branch cancels a run.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      keep_apps:
        description: "Keep the built apps for 3 days, to download and try (about 0.3 GB of Actions storage)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LLAMA_CPP_TAG: b12137          # the llama.cpp release bundled with the app (github.com/ggml-org/llama.cpp/releases);
                                 # changing it means updating each llama_sha256 below
  PYTHON_VERSION: "3.12"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # all three platforms for a full run; Linux alone for a push to a working branch
        os: ${{ fromJSON((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # llama_sha256: the release file's checksum, so a replaced download stops the build
          - { os: macos-latest, name: macOS-arm64, llama: macos-arm64.tar.gz, llama_sha256: 65fc3b01ce7def2177982759b0af8c67221986114ef4c0a56e1e6b9218fa2185 }
          - { os: windows-latest, name: Windows-x64, llama: win-cpu-x64.zip, llama_sha256: 20019b4103c0da8d1b7b65c4a1e542eba4e081ff2d584a7b8ab4723afc835b8d }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - run: uv sync --locked --group build
      - name: Bundle WordNet
        run: uv run python -c "import nltk; nltk.download('wordnet', download_dir='build/nltk_data', raise_on_error=True)"
      - name: Bundle llama.cpp ${{ env.LLAMA_CPP_TAG }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p build/llama-src build/llama
          asset="llama-$LLAMA_CPP_TAG-bin-${{ matrix.llama }}"
          gh release download "$LLAMA_CPP_TAG" -R ggml-org/llama.cpp -p "$asset" -D build
          got=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "build/$asset")
          test "$got" = "${{ matrix.llama_sha256 }}" || { echo "::error::$asset checksum $got does not match the pinned one"; exit 1; }
          case "$asset" in *.zip) unzip -q "build/$asset" -d build/llama-src ;; *) tar -xzf "build/$asset" -C build/llama-src ;; esac
          srv=$(find build/llama-src -type f \( -name llama-server -o -name llama-server.exe \) | head -1)
          test -n "$srv" || { echo "llama-server not found in $asset"; find build/llama-src | head -50; exit 1; }
          cp -a "$(dirname "$srv")"/. build/llama/
          ls -la build/llama | head -40
          "build/llama/$(basename "$srv")" --version
      - name: Apple's on-device model SDK (macOS; compiles Swift, needs the macOS 26 SDK)
        if: runner.os == 'macOS'
        run: |
          sw_vers; xcrun --sdk macosx --show-sdk-version || true
          uv pip install "apple-fm-sdk==0.2.1" && uv run --no-sync python -c "import apple_fm_sdk, sys; print('apple-fm-sdk', apple_fm_sdk.__file__)" \
            || echo "::warning::apple-fm-sdk could not be built on this runner; the build will not offer Apple's on-device model"
      - name: Icon
        run: uv run --no-sync --with pillow python packaging/make_icon.py
      - name: Build the app
        run: uv run --no-sync pyinstaller packaging/bracket.spec --noconfirm --distpath dist --workpath build/work
      - name: Smoke test the built app (empty data folder, real model download, real proposals)
        run: |
          case "${{ runner.os }}" in
            macOS)   exe=dist/bracket.app/Contents/MacOS/bracket ;;
            Windows) exe=dist/bracket/bracket.exe ;;
            *)       exe=dist/bracket/bracket ;;
          esac
          uv run --no-sync python packaging/smoke.py "$exe"
      - name: Check the app's own window (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          case "${{ runner.os }}" in
            macOS)   exe=dist/bracket.app/Contents/MacOS/bracket ;;
            *)       exe=dist/bracket/bracket.exe ;;
          esac
          uv run --no-sync --with pillow python packaging/smoke.py "$exe" --window
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 · a photograph of the window, to check how it looks (a few hundred KB)
        if: runner.os != 'Linux' && always()
        continue-on-error: true            # a look, not a test: a full storage quota must not fail the build
        with:
          name: "window-${{ matrix.name }}"
          path: shots/*
          retention-days: 1
          if-no-files-found: ignore
      - name: Package
        if: inputs.keep_apps || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            macOS)
              # a designed install window (background, icon positions, volume icon); the plain image if that fails
              tiffutil -cathidpicheck build/dmg-background.png build/dmg-background@2x.png -out build/dmg-background.tiff
              if ! uv run --no-sync --with dmgbuild dmgbuild -s packaging/dmg_settings.py -D app=dist/bracket.app \
                   bracket "out/bracket-${{ matrix.name }}.dmg"; then
                echo "::warning::dmgbuild failed; making a plain disk image"
                mkdir -p dmg && cp -R dist/bracket.app dmg/ && ln -s /Applications dmg/Applications
                hdiutil create -volname bracket -srcfolder dmg -ov -format UDZO "out/bracket-${{ matrix.name }}.dmg"
              fi ;;
            Windows)
              7z a -tzip "out/bracket-${{ matrix.name }}.zip" ./dist/bracket >/dev/null ;;
            *)
              tar -C dist -czf "out/bracket-${{ matrix.name }}.tar.gz" bracket ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 · ~0.3 GB for the two apps: kept briefly, and only when wanted
        if: inputs.keep_apps || startsWith(github.ref, 'refs/tags/')
        with:
          name: "bracket-${{ matrix.name }}"
          path: out/*
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 3 }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance (Sigstore, through GitHub's OIDC token)
      attestations: write   # store the attestation with the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { path: out, pattern: "bracket-*", merge-multiple: true }
      # anyone can check a download: shasum -a 256 -c SHA256SUMS.txt (macOS, Linux) or Get-FileHash (Windows)
      - name: Checksums
        run: |
          cd out
          test -n "$(ls bracket-*)" || { echo "::error::no app files to release"; exit 1; }
          sha256sum bracket-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # a signed statement that these exact files were built by this workflow, from this commit, in this repository:
      # gh attestation verify <file> --repo computational-statecraft/bracket
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/bracket-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: out/*
          generate_release_notes: true
