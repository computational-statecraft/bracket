<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[bracket]</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root{
    --void:#0a0a0b; --white:#ffffff; --text-rest:rgba(255,255,255,.30); --dim:rgba(255,255,255,.52); --faint:rgba(255,255,255,.28);
    --ghost:rgba(255,255,255,.16); --hair:rgba(255,255,255,.12); --wash:rgba(255,255,255,.08);
    --brass:#a8916a; --crimson:#c83248;
    --brk:#d9c49b; --brk-rest:rgba(217,196,155,.5); --brk-mark:rgba(217,196,155,.42);   /* bracketed, unsettled wording */
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
    --fs:clamp(34px,3.55vw,86px);            /* the projected text: read from the back of the room */
    --gx:clamp(40px,5.2vw,112px);            /* page margin */
    --gut:clamp(52px,4.6vw,104px);           /* left column for list numbers and states */
    --ease:cubic-bezier(0.2,0,0,1);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--void);color:var(--white);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:rgba(255,255,255,.2)}
  button{font:inherit;color:inherit}
  .caps{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}

  /* brand: small, top left, on both screens */
  .brand{position:fixed;top:30px;left:var(--gx);z-index:20;display:flex;flex-direction:column;gap:7px;pointer-events:none}
  .brand .line{display:flex;align-items:baseline;gap:14px}
  .brand .mark{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.015em;color:rgba(255,255,255,.82)}
  .brand .app{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.01em;color:var(--faint)}
  .brand .rule{width:22px;height:1px;background:var(--crimson)}
  .brand .sub{font-size:9px;letter-spacing:.26em;color:var(--faint)}

  /* ---------------- setup ---------------- */
  #setup{position:fixed;inset:0;z-index:10;background:var(--void);overflow-y:auto;transition:opacity 420ms var(--ease)}
  #setup.gone{opacity:0;pointer-events:none}
  .setup-col{width:min(1040px,86vw);margin:0 auto;padding:13vh 0 80px;display:flex;flex-direction:column;gap:38px}
  .setup-col h1{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .35em;font-family:var(--serif);font-weight:500;font-size:clamp(40px,3.4vw,64px);letter-spacing:.005em;line-height:1.1}
  #docTitle{min-width:6ch;outline:none;border-bottom:1px solid transparent;transition:border-color 200ms var(--ease);cursor:text}
  #docTitle:hover,#docTitle:focus{border-bottom-color:var(--hair)}
  #docTitle:empty::before{content:attr(data-placeholder);color:var(--ghost)}
  .seed-wrap{display:flex;flex-direction:column;gap:12px}
  #seed{width:100%;min-height:24vh;max-height:46vh;padding:26px 30px;background:rgba(255,255,255,.022);border:1px solid var(--hair);border-radius:2px;outline:none;
        font-family:var(--serif);font-size:21px;line-height:1.55;color:rgba(255,255,255,.88);resize:vertical;transition:border-color 200ms var(--ease)}
  #seed:focus{border-color:rgba(255,255,255,.26)}
  #seed::placeholder{color:var(--faint)}
  #seedInfo{color:var(--faint);min-height:14px}
  .status{display:flex;flex-direction:column}
  .status .st{display:grid;grid-template-columns:180px 1fr auto;align-items:baseline;gap:24px;padding:15px 0;border-bottom:1px solid var(--hair)}
  .status .st:first-child{border-top:1px solid var(--hair)}
  .status .k{color:var(--dim)}
  .status .v{font-size:13px;letter-spacing:.04em;color:var(--white);min-width:0}
  .status .v.bad{color:var(--crimson)} .status .v.wait{color:var(--dim)}
  .status .v small{display:block;margin-top:5px;font-size:12px;color:var(--dim);letter-spacing:.02em}
  .status .test{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);transition:color 160ms var(--ease)}
  .status .test:hover{color:var(--white)}
  .actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:baseline;gap:14px;padding:17px 30px;border-radius:1px;cursor:pointer;border:1px solid rgba(255,255,255,.6);background:var(--white);color:var(--void);transition:background 160ms var(--ease),color 160ms var(--ease)}
  .btn:hover{background:rgba(255,255,255,.86)}
  .btn.ghost{background:none;color:var(--white);border-color:var(--hair)} .btn.ghost:hover{border-color:rgba(255,255,255,.4)}
  .btn .kb{opacity:.5;letter-spacing:.1em}
  #ended{display:block;margin-top:16px;color:var(--brass);min-height:13px}
  .setup-foot{display:flex;justify-content:space-between;margin:0 var(--gx) 26px;color:var(--ghost);font-size:10px}

  /* ---------------- live ---------------- */
  #live{position:fixed;inset:0}
  .top-right{position:fixed;top:30px;right:var(--gx);z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
  .top-right .title{font-size:9.5px;color:var(--faint)}
  #readout{font-size:9.5px;color:var(--ghost)}
  #scroll{position:fixed;inset:0;overflow-y:auto;scrollbar-width:none;padding:44vh var(--gx) 52vh var(--gx)}
  #scroll::-webkit-scrollbar{display:none}
  .fade-top,.fade-bot{position:fixed;left:0;right:0;pointer-events:none;z-index:3}
  .fade-top{top:0;height:210px;background:linear-gradient(var(--void) 50%,rgba(10,10,11,0))}
  .fade-bot{bottom:0;height:130px;background:linear-gradient(rgba(10,10,11,0),var(--void) 62%)}
  #table{max-width:min(1640px,100%);display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:var(--gut) minmax(0,1fr);column-gap:clamp(18px,1.6vw,36px);margin-top:.18em;font-size:var(--fs)}
  .row.brk{margin-top:.95em} .row:first-child{margin-top:0}
  .gut{position:relative;font-family:var(--serif);font-size:var(--fs);line-height:1.24;color:var(--text-rest);text-align:right;transition:color 260ms var(--ease)}
  .gut .num{display:block}
  .gut .mk{display:block;margin-top:10px;font-size:9px;line-height:1.3}
  .gut .mk.agreed{color:var(--brass)} .gut .mk.open{color:var(--crimson)} .gut .mk.v{color:var(--ghost)}
  .gut .bar{position:absolute;right:calc(-1 * clamp(10px,.9vw,20px));top:.2em;width:2px;height:1em;background:var(--crimson);display:none}
  .row.open .gut .bar{display:block}
  .body{min-width:0;display:flex;flex-direction:column}
  .lead{margin-bottom:.5em;color:var(--brass);font-size:10.5px;transition:opacity 260ms var(--ease)}
  .sent{margin:0;font-family:var(--serif);font-weight:500;font-size:var(--fs);line-height:1.24;letter-spacing:.004em;color:var(--text-rest);outline:none;white-space:pre-wrap;word-wrap:break-word;caret-color:var(--white);transition:color 260ms var(--ease)}
  .row.h .sent{font-style:italic;font-weight:500;font-size:calc(var(--fs) * .62);letter-spacing:.01em}
  .row.agreed .sent{color:rgba(255,255,255,.4)}
  .row.focus .sent,.row.focus .gut{color:var(--white)}
  .sent[data-empty]:empty::before{content:'Type a sentence';color:var(--ghost)}
  .sent .hov{border-bottom:2px solid rgba(255,255,255,.6)}
  .sent .alt{color:var(--brk-rest);transition:color 260ms var(--ease)} .row.focus .sent .alt{color:var(--brk)}
  .sent .bk{color:var(--brk-mark);font-weight:400}
  .sent .altcur{border-bottom:2px solid var(--brk)}
  .gut .mk.brk{color:var(--brk)}
  .addalt{display:flex;align-items:baseline;gap:14px;cursor:pointer;color:var(--brk);font-size:10.5px} .addalt:hover{color:#efe0bf}
  .brkpanel .slot p{color:var(--brk-rest)} .brkpanel .slot.cur p,.brkpanel .slot:hover p{color:var(--brk)}
  .brkpanel .rail{border-left-color:var(--brk-mark)}
  .sent .sel{background:var(--wash);box-shadow:0 0 0 .12em var(--wash);border-radius:1px}
  .extras{display:flex;flex-direction:column;gap:.55em;margin-top:.5em}
  .syn{display:flex;align-items:baseline;gap:1.2em;font-size:calc(var(--fs) * .5)}
  .syn .opts{display:flex;flex-wrap:wrap;align-items:baseline;gap:.9em;font-family:var(--serif);color:var(--dim)}
  .syn .opts span.dot{color:var(--ghost)} .syn .opts span[data-i]{cursor:pointer}
  .syn .opts span.pick{color:var(--white);border-bottom:1px solid var(--brass)}
  .dials{display:flex;flex-wrap:wrap;align-items:baseline;gap:42px}
  .dials .d{display:flex;align-items:baseline;gap:13px}
  .dials .r,.dials .v{font-size:10.5px;color:var(--faint)} .dials .v{color:var(--white)}
  .dials .r.cur{color:var(--white);border-bottom:1px solid var(--brass);padding-bottom:3px}
  .rail{display:flex;flex-direction:column;gap:.3em;border-left:1px solid var(--hair);padding-left:.6em;margin-left:-.6em;font-size:calc(var(--fs) * .6)}
  .slot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:40px;cursor:pointer}
  .slot p{margin:0;font-family:var(--serif);font-weight:400;line-height:1.28;color:var(--dim);transition:color 140ms var(--ease)}
  .slot.cur p,.slot:hover p{color:var(--white)}
  .slot .caps{font-size:9.5px;color:var(--faint);white-space:nowrap}
  .slot.cur .caps{color:var(--brass)}
  .slot .chg{color:var(--brass)} .slot.cur .chg{color:#d9c49b}
  .slot .flag{color:var(--crimson);margin-left:14px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5em 1.4em;margin-top:.35em;font-size:calc(var(--fs) * .42)}
  .grid.whole{font-size:calc(var(--fs) * .3)}
  .cell{display:grid;grid-template-columns:1.3em minmax(0,1fr);align-items:baseline;cursor:pointer;min-width:0}
  .cell .n{font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:var(--ghost)}
  .cell p{margin:0;font-family:var(--serif);line-height:1.25;color:var(--dim);transition:color 140ms var(--ease)}
  .cell.cur p,.cell:hover p{color:var(--white)} .cell.cur .n{color:var(--brass)}
  .cell .chg{color:var(--brass)} .cell.cur .chg{color:#d9c49b}
  .cell .src{font-family:var(--sans);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ghost);margin-left:.7em}
  .cell .flag{display:block;margin-top:.2em;font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--crimson)}
  .cell.empty p{color:var(--ghost)}
  .agreed{margin:.1em 0 .7em;font-size:calc(var(--fs) * .27)}
  .agreed .head{font-size:9.5px;color:var(--brass);margin-bottom:.5em}
  .agreed .none{font-size:9.5px;color:var(--faint)}
  .prec{display:grid;grid-template-columns:1.3em minmax(0,1fr);align-items:baseline;cursor:pointer;margin-bottom:.55em}
  .prec .n{font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:var(--ghost)}
  .prec p{margin:0;font-family:var(--serif);line-height:1.3;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;transition:color 140ms var(--ease)}
  .prec .ph{color:var(--brass)} .prec.cur p,.prec:hover p{color:var(--white)} .prec.cur .ph{color:#d9c49b} .prec.cur .n{color:var(--brass)}
  .prec .cite{grid-column:2;margin-top:.25em;font-size:9px;color:var(--ghost)} .prec.cur .cite{color:var(--faint)}
  .prec .cite b{font-weight:400;color:var(--brass)}
  .more{margin-top:.9em;font-size:9.5px;color:var(--faint)}
  .tiererr{font-size:9.5px;color:var(--crimson)}
  .hist{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 22px;font-size:10px;color:var(--faint)}
  .hist .now{color:var(--dim)} .hist .dis{color:var(--crimson)}
  .inline-input{width:100%;background:none;border:0;border-bottom:1px solid var(--hair);outline:none;font-family:var(--serif);font-size:calc(var(--fs) * .5);color:var(--white);padding:.2em 0}
  .inline-input::placeholder{color:var(--ghost)}
  .keys{position:fixed;left:var(--gx);right:var(--gx);bottom:22px;z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:40px;font-size:9.5px;letter-spacing:.16em;color:var(--ghost)}
  #hint{transition:color 300ms var(--ease)} #hint.flash{color:var(--dim)}
  .progress{position:fixed;left:0;bottom:0;height:2px;background:var(--brass);opacity:.7;transition:width 600ms var(--ease);z-index:6}

  /* end-of-session confirmation */
  #confirm{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,10,11,.96);flex-direction:column;gap:22px}
  #confirm.on{display:flex}
  #confirm .q{font-family:var(--serif);font-size:clamp(34px,3vw,60px)}
  #confirm .caps{color:var(--dim)}

  /* setup: model choice, key, library, settings */
  .status .v .mlist{display:flex;flex-direction:column;gap:2px;margin-top:12px}
  .mrow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:7px 0;cursor:pointer;color:var(--dim)}
  .mrow:hover,.mrow.on{color:var(--white)}
  .mrow input{accent-color:var(--brass);margin:0}
  .mrow .ml{font-size:13px;letter-spacing:.04em} .mrow .mm{display:block;font-size:12px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
  .mrow .mr{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
  .mrow.dis{opacity:.45}
  .dl{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .dlbar{height:2px;background:var(--hair);position:relative;overflow:hidden} .dlbar i{position:absolute;left:0;top:0;bottom:0;background:var(--brass);transition:width 400ms var(--ease)}
  .small-btn{background:none;border:1px solid var(--hair);padding:9px 16px;cursor:pointer;color:var(--white);border-radius:1px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .small-btn:hover{border-color:rgba(255,255,255,.4)} .small-btn.solid{background:var(--white);color:var(--void);border-color:var(--white)}
  .small-btn:disabled{opacity:.4;cursor:default}
  .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .field{background:rgba(255,255,255,.03);border:1px solid var(--hair);color:var(--white);padding:9px 12px;font:13px var(--sans);letter-spacing:.02em;border-radius:1px;outline:none;min-width:0}
  .field:focus{border-color:rgba(255,255,255,.3)} select.field{appearance:auto}
  #keyIn{flex:1 1 320px}
  #settings{display:flex;flex-direction:column;gap:30px;padding-top:6px}
  #settings h3{margin:0 0 4px;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
  .sgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px 24px;align-items:center}
  .sgrid label{font-size:12px;color:var(--dim);letter-spacing:.04em}
  .sgrid .note{grid-column:2;font-size:11.5px;color:var(--faint);margin-top:-6px}
  .sgrid .locked{font-size:11px;color:var(--brass)}
  .sgrid input.field:not([type=file]):not(#docBody):not(#docTitle2):not(#docDate){width:min(100%,520px)}
  .muted{color:var(--faint);font-size:12px;letter-spacing:.02em;line-height:1.6}
  .muted code{font-size:11.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="brand" aria-label="bracket">
  <span class="line"><span class="mark" id="brandOrg" hidden></span><span class="app">[bracket]</span></span>
  <span class="rule" aria-hidden="true"></span>
</div>

<!-- ======== setup ======== -->
<section id="setup" aria-label="Setup">
  <div class="setup-col">
    <div>
      <h1><span id="docTitle" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Name this session" aria-label="Session title"></span></h1>
      <span id="ended" class="caps"></span>
    </div>
    <div class="seed-wrap">
      <textarea id="seed" spellcheck="false" placeholder="Paste the draft. Headings, bold lead-ins and numbered lists are kept as structure."></textarea>
      <div id="seedInfo" class="caps"></div>
    </div>
    <div class="status" id="status">
      <div class="st"><span class="k caps">Lexicon</span><span class="v wait" id="stLex">Checking…</span><span></span></div>
      <div class="st"><span class="k caps">Local model</span><div class="v wait" id="stLocal">Checking…</div><button class="test caps" id="testLocal">Test</button></div>
      <div class="st"><span class="k caps">Agreed language</span><div class="v wait" id="stLib">Checking…</div><span></span></div>
      <div class="st"><span class="k caps">Claude</span><div class="v wait" id="stCloud">Checking…</div><button class="test caps" id="testCloud">Test</button></div>
      <div class="st"><span class="k caps">Session</span><span class="v" id="stLog">…</span><button class="test caps" id="settingsBtn">Settings</button></div>
    </div>
    <div id="settings" hidden></div>
    <div class="actions">
      <button class="btn caps" id="beginBtn">Begin live session <span class="kb" data-kb>⌘↵</span></button>
      <button class="btn ghost caps" id="resumeBtn" hidden></button>
    </div>
  </div>
  <div class="setup-foot caps"><span>F full screen</span><span id="setupSession"></span></div>
</section>

<!-- ======== live ======== -->
<section id="live" aria-label="Live drafting">
  <div class="top-right"><span class="title caps" id="headTitle"></span><span class="caps" id="readout"></span></div>
  <div id="scroll"><div id="table"></div></div>
  <div class="fade-top"></div><div class="fade-bot"></div>
  <div class="keys caps"><span id="hint"></span><span id="keysRight" data-kb>⌥E export · ⌥Q end</span></div>
  <div class="progress" id="progress" style="width:0"></div>
</section>

<div id="confirm" role="dialog" aria-label="End session">
  <div class="q">End the session?</div>
  <div class="caps">↵ end and save the record · esc keep drafting</div>
</div>

<script>
/* ---------------- state ---------------- */
const S = {
  doc: { sentences: [] },        // {id,text,state,version,kind,label,brk,history:[{version,text,at,via}],dissents:[]}
  undo: [], redo: [],
  focusId: null,
  live: false,
  mode: 'rest',                   // rest | hover | rail | sentence | dissent | confirm
  hover: null,                    // {id,start,end,opts:[],pick:int}
  rail: null,                     // {id,start,end,source,slots:[{text,flags,tier,ms}],cur:int,dials:{strength,register,length},sse}
  showHist: null,
  status: null,
  cache: new Map(),
};
const REGISTERS = ['plain','institutional','formal'], LENGTHS = ['shorter','same','longer'];
// Mac key symbols on a Mac; Ctrl / Alt / Shift elsewhere (the key handling accepts both)
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const kb = t => MAC ? t : t.replace(/⌘/g, 'Ctrl+').replace(/⌥/g, 'Alt+').replace(/⇧/g, 'Shift+');
document.querySelectorAll('[data-kb]').forEach(el => { el.textContent = kb(el.textContent); });
const KEYS_REST = kb('double-click a word for proposals and alternatives · ⌘↵ rewrite sentence · ⌥B bracket · ⌥ hover words · ⇧↵ agree · ⌥O open · ⌥D dissent · ⌥H history · ⌥↑↓ move · ⌘Z undo');
const $ = s => document.querySelector(s);
// every write carries X-Bracket: the server refuses writes without it, so other web pages cannot drive it
const api = (p, body, method = 'POST') => fetch(p, { method, headers:{'Content-Type':'application/json','X-Bracket':'1'}, body: body === undefined ? undefined : JSON.stringify(body) }).then(r=>r.json());
const log = (kind, payload, sentence_id) => api('/api/event', {kind, payload, sentence_id}).catch(()=>{});
const now = () => new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid = () => Math.random().toString(36).slice(2, 12);
const secs = ms => (ms/1000).toFixed(1) + ' s';
// Brackets: unsettled wording kept in the text itself, diplomatic style: "[shall / should]". One alternative alone is
// a placeholder or a contested term. Stored as plain text, so history, undo, export and the models all see it.
const BRACKET = /\[([^\[\]]*)\]/g, SEP = ' / ';
function bracketsIn(text){
  const out = []; let m; BRACKET.lastIndex = 0;
  while ((m = BRACKET.exec(text))){
    const start = m.index, end = start + m[0].length, alts = []; let pos = start + 1;
    m[1].split(SEP).forEach(a => { alts.push({ text: a, start: pos, end: pos + a.length }); pos += a.length + SEP.length; });
    out.push({ start, end, alts });
  }
  return out;
}
const bracketAt = (text, off) => bracketsIn(text).find(b => off >= b.start && off <= b.end);
const KEYS_SPAN = kb('1–9 pick · A agreed language · ⇥ next · ↵ accept · ⇧↵ keep as alternative · B add alternative · ←→ weaker / stronger · ↑↓ length · R register · C Claude · esc');
const KEYS_SENT = kb('1–9 pick · A agreed language · ⇥ next · ↵ accept · ⇧↵ keep as alternative · ←→ weaker / stronger · ↑↓ length · R register · C Claude · esc');
// one proposal per line, without list numbering, bullets, quotes or a reasoning model's <think> preamble (mirrors prompts.parse_lines)
function parseLines(text, n){
  const out = [];
  text.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').split('\n').forEach(line => {
    const t = line.trim().replace(/^["•\-–*\s]+|["\s]+$/g, '').replace(/^\d{1,2}[.)]\s+/, '').trim();
    if (t && !out.includes(t)) out.push(t);
  });
  return out.slice(0, n);
}

async function begin(how){
  const snap = await fetch('/api/snapshot').then(r=>r.json()).catch(()=>({doc:null}));
  const hadDraft = !!(snap.doc && snap.doc.sentences && snap.doc.sentences.length);
  if (how === 'resume' && hadDraft){ S.doc = snap.doc; }
  else {
    if (hadDraft) log('snapshot.replaced', { doc: snap.doc });
    const text = $('#seed').value;
    if (how === 'seed'){
      const r = await api('/api/segment', { text, structured: true });
      S.doc = { sentences: r.sentences.map(s => ({ ...s, history:[{version:1,text:s.text,at:now(),via:'seed'}], dissents:[] })) };
    } else {
      S.doc = { sentences: [{ id: sid(), text: '', state: 'draft', version: 1, kind: 'p', label: null, brk: true, history: [], dissents: [] }] };
    }
  }
  S.doc.title = docTitle();
  S.undo = []; S.redo = []; S.live = true; S.mode = 'rest';
  log('session.begin', { how, sentences: S.doc.sentences.length, title: S.doc.title });
  $('#headTitle').textContent = `${S.doc.title || 'Untitled session'} · ${S.status ? S.status.session : ''}`;
  $('#setup').classList.add('gone'); $('#ended').textContent = '';
  closeAll(false); render(); snapshot();
  setTimeout(() => focusSentence(S.doc.sentences[0].id, 'end'), 380);

function pEl(id){ return document.querySelector(`p.sent[data-id="${id}"]`); }

function centre(id){

  const open = S.rail && S.rail.id === id;

  if (k === 'Enter' && p){ // new sentence after, in the same block
    e.preventDefault(); flushTyping();
    const at = caretOffset(p); const tail = s.text.slice(at).trim(); const head = s.text.slice(0, at).trimEnd();
    if (tail) commitText(s.id, head, 'typed'); else pushUndo();
    const ns = { id: sid(), text: tail, state: 'draft', version: 1, kind: s.kind === 'h' ? 'p' : (s.kind || 'p'), label: null, brk: s.kind === 'h', history: [{ version: 1, text: tail, at: now(), via: tail ? 'split' : 'new' }], dissents: [] };
    S.doc.sentences.splice(idx(s.id) + 1, 0, ns); log('new', {}, ns.id); render(); snapshot(); focusSentence(ns.id, 'start'); return;
  }
  if (k === 'Backspace' && p && caretOffset(p) === 0 && !getSelection().toString()){ // join with previous
    const i = idx(s.id); if (i === 0) return; const prev = S.doc.sentences[i-1];
    e.preventDefault(); flushTyping(); pushUndo(); const at = prev.text.length; const joined = (prev.text + ' ' + s.text).trim();
    S.doc.sentences.splice(i, 1); prev.text = joined; prev.version += 1; prev.history.push({ version: prev.version, text: joined, at: now(), via: 'join' });
    // the joined sentence's dissents stay on the record; agreement on either half no longer holds
    prev.dissents.push(...s.dissents.map(d => ({ ...d, joined_from: s.id })));
    prev.state = (prev.state === 'open' || s.state === 'open') ? 'open' : 'draft';
    log('join', { removed: s.id, removed_text: s.text, removed_state: s.state, dissents_moved: s.dissents.length }, prev.id); render(); snapshot(); focusSentence(prev.id); setCaret(pEl(prev.id), at + 1); return;
  }
  if (!meta && e.altKey && e.code === 'KeyB' && p){ // bracket the word at the caret, or open the bracket it sits in
    e.preventDefault(); flushTyping(); const off = caretOffset(p); const b = bracketAt(s.text, off);
    if (b){ openBracket(s.id, b); return; }
    let a = off, z = off; while (a > 0 && /[\w'’-]/.test(s.text[a-1])) a--; while (z < s.text.length && /[\w'’-]/.test(s.text[z])) z++;
    if (z > a) bracketize(s.id, a, z); return;
  }
  if (!meta && e.altKey && e.code === 'KeyO'){ e.preventDefault(); setState(s.id, s.state === 'open' ? 'draft' : 'open'); return; }
  if (!meta && e.altKey && e.code === 'KeyD'){ e.preventDefault(); S.mode = 'dissent'; render(); return; }
  if (!meta && e.altKey && e.code === 'KeyH'){ e.preventDefault(); S.showHist = S.showHist === s.id ? null : s.id; render(); return; }
  if (k === 'ArrowDown' && p && e.altKey){ e.preventDefault(); const n = S.doc.sentences[idx(s.id)+1]; if (n) focusSentence(n.id, 'start'); return; }
  if (k === 'ArrowUp' && p && e.altKey){ e.preventDefault(); const n = S.doc.sentences[idx(s.id)-1]; if (n) focusSentence(n.id, 'end'); return; }
});
document.addEventListener('keyup', e => { if (e.key === 'Alt'){ altDown = false; if (S.mode === 'hover'){ closeAll(false); render(); } } });
window.addEventListener('blur', () => { altDown = false; });
// clicking a row focuses it
document.addEventListener('mousedown', e => { const row = e.target.closest && e.target.closest('.row'); if (row && S.mode !== 'rail' && S.mode !== 'sentence') setFocusRow(row.dataset.id); });
</script>
